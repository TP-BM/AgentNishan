app = "meetnish"
primary_region = "fra"

[build]

[env]
PORT = "8080"
DATABASE_PATH = "/data/meetnish.db"

# The poller has to keep running between meetings, so the machine must not be
# suspended or stopped when HTTP traffic goes quiet.
[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/healthz"
timeout = "5s"

[mounts]
source = "meetnish_data"
destination = "/data"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
