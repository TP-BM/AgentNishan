# Fly app names are globally unique and must be lowercase.
app = "nishan"
primary_region = "fra"

[build]

# Non-sensitive configuration lives here so it is version-controlled and
# reviewable. Credentials go to `fly secrets set` instead.
[env]
PORT = "8080"
DATABASE_PATH = "/data/meetnish.db"
APP_BASE_URL = "https://nishan.fly.dev"
VEXA_BASE_URL = "https://api.cloud.vexa.ai"
VEXA_BOT_NAME = "Thilina's Agent (Nishan)"
VEXA_LANGUAGE = "en"
ANTHROPIC_MODEL = "claude-opus-5"
MAILER = "resend"
MAIL_FROM = "onboarding@resend.dev"
POLL_STALE_THRESHOLD = "6"
POLL_ADMIT_THRESHOLD = "15"
LEAVE_COMMAND_ENABLED = "true"
# "nathan" is an observed mishearing, not a person — see README.
LEAVE_COMMAND_NAMES = "nishan,nishaan,nishawn,nissan,nathan,nish"
LEAVE_COMMAND_NAMELESS = "true"

# The poller has to keep running between meetings, so the machine must not be
# suspended or stopped when HTTP traffic goes quiet.
[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/healthz"
timeout = "5s"

[mounts]
source = "meetnish_data"
destination = "/data"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
